[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-agent"
version = "0.1.0"
description = "Evidence-first sports market research and risk-control agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prediction-agent = "prediction_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

